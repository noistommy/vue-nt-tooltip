name: build to docs
run-name: ${{ github.actor }} is testing out GitHub Actions
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Checkout code
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - name: set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: echo "🚀 Node.js ${{ runner.node-version }} has been set up on the runner."
      - name: install dependencies
        run: npm install
      - run: echo "🔍 Dependencies have been installed."
      - name: build the project
        run: npm run build:demo
      - run: echo "🎉 The project has been built."
      - name: Copy build files to docs
        run: cp -r demo/dist/* docs/
      - run: echo "🎉 The build files have been copied to docs."
      - name: Commit changes
        run: git add docs/
        run: git commit -m "Update docs"
        run: git push origin main
      - run: echo "🎉 The changes have been committed and pushed to the main branch."